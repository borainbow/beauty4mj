.chip{flex:0 0 auto; font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--sub); white-space:nowrap}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent)}
.toggle-btn.active{background:var(--accent2-bg); color:var(--accent2-strong); border-color:transparent}
.search-input{width:100%; margin-bottom:8px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:12px; -webkit-appearance:none; appearance:none; line-height:1.4; box-sizing:border-box}
.backup-btn{flex:1; font-size:12px; padding:8px 4px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--sub); cursor:pointer}
main{padding:14px 16px 100px}
.hint{font-size:12px; color:var(--sub); background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:14px; display:flex; gap:8px; align-items:flex-start}
.hint button{margin-left:auto; border:none; background:none; color:var(--sub); font-size:16px; padding:0 2px; cursor:pointer}
.section-title{font-size:12px; color:var(--sub); margin:18px 0 8px; font-weight:600}
.card{padding:12px; border-radius:12px; margin-bottom:8px; cursor:pointer; border:1px solid var(--border); box-shadow:0 2px 6px var(--shadow-card)}
.card.neutral{background:var(--card)}
.card.warn{background:var(--warn-bg); border-color:transparent}
.card.danger{background:var(--danger-bg); border-color:transparent}
.card.done{opacity:.55}
.cat-badge{display:inline-block; font-size:10.5px; font-weight:600; padding:1px 7px; border-radius:999px; margin-right:2px}
.cat-skin{background:#ece0f3; color:#7c5a9e}
.cat-cleanse{background:#dfe8d3; color:#5a7a3a}
.cat-sun{background:#ffe9c7; color:#a67425}
.cat-color{background:#f7dede; color:#b5546a}
.cat-etc{background:#ece6dd; color:#8a877e}
.thumb{width:42px; height:42px; border-radius:9px; background:var(--border); flex:0 0 auto; object-fit:cover}
.item-name{font-size:14px; font-weight:600; margin:0}
.item-sub{font-size:11.5px; color:var(--sub); margin:2px 0 0}
.dday{font-size:13px; font-weight:700; flex:0 0 auto}
.card.neutral .dday{color:var(--sub)}
.card.warn .dday{color:var(--warn-text)}
.card.danger .dday{color:var(--danger-text)}
.empty{text-align:center; color:var(--sub); font-size:13px; padding:60px 20px; line-height:1.6}
.empty-icon{display:block; font-size:32px; margin-bottom:10px}
.fab{
  position:fixed; right:18px; bottom:calc(20px + var(--safe-b)); width:54px; height:54px; border-radius:50%;
  background:var(--accent); color:#fff; border:none; font-size:26px; box-shadow:0 4px 14px rgba(0,0,0,.2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10;
}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:20}
.overlay.open{display:flex}
.sheet{
  background:var(--bg); width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0;
  padding:18px 18px calc(24px + var(--safe-b));
}
.sheet h2{font-size:16px; margin:0 0 16px}
label{display:block; font-size:12px; color:var(--sub); margin:14px 0 6px}
input[type=text],input[type=date],select{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:16px;
}
input[type=date]{ min-width:0; padding:10px 8px; overflow:hidden; }
input[type=date]::-webkit-datetime-edit,
input[type=date]::-webkit-datetime-edit-fields-wrapper,
input[type=date]::-webkit-datetime-edit-text,
input[type=date]::-webkit-datetime-edit-month-field,
input[type=date]::-webkit-datetime-edit-day-field,
input[type=date]::-webkit-datetime-edit-year-field{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif !important;
}
input[type=date]::-webkit-calendar-picker-indicator{ margin-left:2px; padding:4px; flex-shrink:0; }
.upload{
  display:flex; align-items:center; justify-content:center; gap:8px; height:80px; border-radius:10px;
  border:1px dashed var(--muted); color:var(--sub); font-size:13px; position:relative; overflow:hidden;
}
.upload img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.upload input{position:absolute; inset:0; opacity:0}
.row{display:flex; gap:8px}
.btn-toggle{flex:1; text-align:center; padding:9px 0; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--sub); font-size:13px; cursor:pointer}
.btn-toggle.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.pao-btn{flex:1; text-align:center; padding:9px 0; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:13px; cursor:pointer}
.pao-btn.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--sub); cursor:pointer; margin-right:6px}
.chk.on{background:var(--accent-bg); color:var(--accent-text); border-color:transparent}
.actions{display:flex; gap:8px; margin-top:22px}
.btn-main{flex:1; padding:13px; border-radius:11px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer}
.btn-sub{padding:13px 16px; border-radius:11px; border:1px solid var(--border); background:var(--card); color:var(--sub); font-size:14px; cursor:pointer}
.err{color:var(--danger-text); font-size:12px; margin-top:4px; display:none}
#searchInput{ font-size:12px !important; padding:6px 24px 6px 26px !important; border-radius:999px !important; }
</style>
</head>

function getExpiry(it){
  if(it.method==='date') return new Date(it.directDate);
  const d = new Date(it.openDate);
  d.setMonth(d.getMonth()+it.paoMonths);
  return d;
}
function ddayOf(it){
  const exp = getExpiry(it);
  const today = new Date(); today.setHours(0,0,0,0);
  exp.setHours(0,0,0,0);
  return Math.round((exp-today)/86400000);
}
function formatDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}.${m}.${day}`;
}

function cardHtml(it, isDone){
  const dday = ddayOf(it);
  const exp = getExpiry(it);
  let cls='neutral';
  if(!isDone && dday<=30) cls='danger';
  const thumb = it.photo ? `<img class="thumb" src="${it.photo}">` : `<div class="thumb"></div>`;

  let bar = '';
  if(!isDone){
    const barColor = dday<=30 ? 'var(--danger-text)' : 'var(--accent)';
    const rawPct = Math.max(0, Math.min(60, dday)) / 60 * 100;
    const pct = Math.max(8, Math.min(92, rawPct));
    const badgeLabel = dday<0 ? `D+${-dday}` : `D-${dday}`;
    bar = `<div style="margin-top:12px; position:relative; height:20px">
      <div style="position:absolute; top:50%; left:0; right:0; height:4px; background:var(--border); border-radius:999px; transform:translateY(-50%)"></div>
      <div style="position:absolute; top:50%; left:0; width:${pct}%; height:4px; background:${barColor}; border-radius:999px; transform:translateY(-50%)"></div>
      <div style="position:absolute; top:50%; left:${pct}%; transform:translate(-50%,-50%); background:${barColor}; color:#fff; font-size:11px; font-weight:400; padding:3px 8px; border-radius:999px; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.15)">${badgeLabel}</div>
    </div>`;
  }

  return `<div class="card ${cls} ${isDone?'done':''}" onclick="openModal('${it.id}')" style="flex-direction:column; align-items:stretch">
    <div style="display:flex; align-items:center; gap:12px">
      ${thumb}
      <div style="flex:1">
        <p class="item-name">${it.brand ? `<span style="color:var(--text); opacity:.7; font-weight:400">[${escapeHtml(it.brand)}]</span> ` : ''}${escapeHtml(it.name)}</p>
        <p class="item-sub"><span class="cat-badge ${catClass(it.category)}">${it.category}</span> · ${it.status==='unopened'?'미개봉':'<span style="color:var(--accent2-strong); font-weight:700">사용중</span>'}</p>
      </div>
      <div style="font-size:11px; color:var(--sub); white-space:nowrap; flex:0 0 auto">${isDone ? '사용완료' : formatDate(exp)+'까지'}</div>
    </div>
    ${bar}
  </div>`;
}
function escapeHtml(s){ return s.replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function csvEscape(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(/[",\n\r]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function parseCSV(text){
  const rows = []; let field='', row=[], inQuotes=false, i=0;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=c; i++; continue;
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ row.push(field); field=''; i++; continue; }
      if(c==='\n' || c==='\r'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(field); rows.push(row); row=[]; field=''; i++; continue;
      }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v=>v && v.trim()!==''));
}
function exportData(){
  const header = ['브랜드','화장품명','카테고리','유통기한','상태','메모'];
  const rows = items.map(it=>{
    const exp = getExpiry(it);
    const y=exp.getFullYear(), m=String(exp.getMonth()+1).padStart(2,'0'), d=String(exp.getDate()).padStart(2,'0');
    const statusLabel = it.usedUp ? '사용완료' : (it.status==='unopened' ? '미개봉' : '개봉');
    return [it.brand || '', it.name, it.category, `${y}-${m}-${d}`, statusLabel, it.memo || ''];
  });
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `Beauty4MJ_${today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const rows = parseCSV(ev.target.result);
      if(rows.length<2) throw new Error('empty');
      const header = rows[0].map(h=>h.trim());
      const findCol = names => header.findIndex(h=>names.includes(h));
      const nameIdx = findCol(['화장품명','제품명']);
      const catIdx = findCol(['카테고리']);
      const expIdx = findCol(['유통기한','사용기한']);
      const statusIdx = findCol(['상태','개봉여부']);
      const memoIdx = findCol(['메모']);
      const brandIdx = findCol(['브랜드']);
      if(nameIdx===-1 || expIdx===-1) throw new Error('format');
      const parsed = rows.slice(1).filter(r=>r[nameIdx] && r[nameIdx].trim()).map(r=>{
        const dateStr = r[expIdx] || '';
        const m = dateStr.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
        const directDate = m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : '';
        const statusRaw = statusIdx>-1 ? (r[statusIdx]||'') : '';
        return {
          id: 'id'+Date.now()+Math.random().toString(36).slice(2,7),
          name: r[nameIdx].trim(),
          brand: brandIdx>-1 ? (r[brandIdx]||'').trim() : '',
          category: (catIdx>-1 && r[catIdx] && r[catIdx].trim()) || '기타',
          status: statusRaw.includes('미개봉') ? 'unopened' : 'inuse',
          method: 'date', openDate:'', paoMonths:12, directDate,
          notifyDays:[30,7], photo:null,
          memo: memoIdx>-1 ? (r[memoIdx]||'').trim() : '',
          usedUp: statusRaw.includes('완료')
        };
      }).filter(it=>it.directDate);
      if(!parsed.length) throw new Error('no rows');
      items = items.concat(parsed);
      save_store();
      render();
      alert(`${parsed.length}개 항목을 불러왔어요.`);
    }catch(err){
      alert('CSV 형식을 확인해주세요. (화장품명, 유통기한 열이 필요해요)');
    }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function showAppNotification(title, body){
  if('serviceWorker' in navigator){
    return navigator.serviceWorker.ready.then(reg=>reg.showNotification(title, {body}));
  }
  return Promise.reject(new Error('no-sw'));
}
function sendTestNotification(){
  if(!('Notification' in window)){ alert('이 브라우저는 알림을 지원하지 않아요.'); return; }
  const title = '🧴 Beauty4MJ 알림 테스트';
  const body = '이런 모양으로 떠요! 실제로는 유통기한 임박 시 자동으로 알려드려요.';
  const fire = () => {
    showAppNotification(title, body).catch(()=>{
      try{ new Notification(title, { body }); }
      catch(e){ alert('이 기기에서는 알림을 표시할 수 없어요. iPhone은 홈 화면에 추가한 뒤 다시 시도해주세요.'); }
    });
  };
  if(Notification.permission === 'granted'){
    fire();
  } else if(Notification.permission === 'denied'){
    alert('알림이 차단되어 있어요. iPhone은 설정 > Safari(또는 이 앱) > 알림에서 허용해주세요.');
  } else {
    Notification.requestPermission().then(p=>{ if(p==='granted') fire(); });
  }
}

// 알림 체크 (앱이 열려 있을 때만 동작)
function checkNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const today = new Date().toISOString().slice(0,10);
  const lastCheck = localStorage.getItem('notify-check-'+today);
  if(lastCheck) return;
  items.filter(i=>!i.usedUp).forEach(it=>{
    const d = ddayOf(it);
    if(it.notifyDays.includes(d)){
      showAppNotification('유통기한 임박', `${it.name} · D-${d}`).catch(()=>{
        try{ new Notification('유통기한 임박', { body: `${it.name} · D-${d}` }); }catch(e){}
      });
    }
  });
  localStorage.setItem('notify-check-'+today, '1');
}
if('Notification' in window && Notification.permission==='default'){
  setTimeout(()=>{ Notification.requestPermission().then(()=>checkNotifications()); }, 800);
} else {
  checkNotifications();
}

render();
</script>
