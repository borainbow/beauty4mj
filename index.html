<style>
:root{
  --bg:#fdfaf6; --card:#ffffff; --border:#ece6dd; --text:#2c2c2a; --sub:#8a877e; --muted:#b4b2a9;
  --accent:#7d6fa3; --accent-bg:#efebf5; --accent-text:#453a63;
  --accent2:#8ea055; --accent2-bg:#eef2e2; --accent2-text:#4b5a26;
  --danger-bg:#ffe0e0; --danger-text:#d81e1e;
  --warn-bg:#faeeda; --warn-text:#633806;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1b19; --card:#26241f; --border:#3a3833; --text:#f1efe8; --sub:#b4b2a9; --muted:#7c7a72;
    --accent:#b3a5d6; --accent-bg:#352c4a; --accent-text:#dcd3ee;
    --accent2:#b9cf7e; --accent2-bg:#3a4520; --accent2-text:#d8e6b0;
    --danger-bg:#5c1414; --danger-text:#ff6b6b;
    --warn-bg:#412402; --warn-text:#fac775;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1b19; --card:#26241f; --border:#3a3833; --text:#f1efe8; --sub:#b4b2a9; --muted:#7c7a72;
  --accent:#b3a5d6; --accent-bg:#352c4a; --accent-text:#dcd3ee;
  --accent2:#b9cf7e; --accent2-bg:#3a4520; --accent2-text:#d8e6b0;
  --danger-bg:#5c1414; --danger-text:#ff6b6b;
  --warn-bg:#412402; --warn-text:#fac775;
}
*{box-sizing:border-box}
html{scroll-padding-top:var(--safe-t)}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
}
header{
  position:sticky; top:0; padding-top:calc(var(--safe-t) + 14px);
  background:var(--bg); z-index:5; padding-left:16px; padding-right:16px; padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
h1{font-size:18px; font-weight:600; margin:0 0 10px}
.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px}
.chip{flex:0 0 auto; font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--sub); white-space:nowrap}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent)}
.toggle-btn.active{background:var(--accent2-bg); color:var(--accent2-text); border-color:transparent}
.search-input{width:100%; margin-bottom:8px; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:16px}
.backup-btn{flex:1; font-size:12px; padding:8px 4px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--sub); cursor:pointer}
main{padding:14px 16px 100px}
.hint{font-size:12px; color:var(--sub); background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:14px; display:flex; gap:8px; align-items:flex-start}
.hint button{margin-left:auto; border:none; background:none; color:var(--sub); font-size:16px; padding:0 2px; cursor:pointer}
.section-title{font-size:12px; color:var(--sub); margin:18px 0 8px; font-weight:600}
.card{padding:12px; border-radius:12px; margin-bottom:8px; cursor:pointer; border:1px solid var(--border)}
.card.neutral{background:var(--card)}
.card.warn{background:var(--warn-bg); border-color:transparent}
.card.danger{background:var(--danger-bg); border-color:transparent}
.card.done{opacity:.55}
.thumb{width:42px; height:42px; border-radius:9px; background:var(--border); flex:0 0 auto; object-fit:cover}
.item-name{font-size:14px; font-weight:600; margin:0}
.item-sub{font-size:11.5px; color:var(--sub); margin:2px 0 0}
.dday{font-size:13px; font-weight:700; flex:0 0 auto}
.card.neutral .dday{color:var(--sub)}
.card.warn .dday{color:var(--warn-text)}
.card.danger .dday{color:var(--danger-text)}
.empty{text-align:center; color:var(--sub); font-size:13px; padding:60px 20px}
.fab{
  position:fixed; right:18px; bottom:calc(20px + var(--safe-b)); width:54px; height:54px; border-radius:50%;
  background:var(--accent); color:#fff; border:none; font-size:26px; box-shadow:0 4px 14px rgba(0,0,0,.2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10;
}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:20}
.overlay.open{display:flex}
.sheet{
  background:var(--bg); width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0;
  padding:18px 18px calc(24px + var(--safe-b));
}
.sheet h2{font-size:16px; margin:0 0 16px}
label{display:block; font-size:12px; color:var(--sub); margin:14px 0 6px}
input[type=text],input[type=date],select{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:16px;
}
input[type=date]{ min-width:0; padding:10px 8px; }
.upload{
  display:flex; align-items:center; justify-content:center; gap:8px; height:80px; border-radius:10px;
  border:1px dashed var(--muted); color:var(--sub); font-size:13px; position:relative; overflow:hidden;
}
.upload img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.upload input{position:absolute; inset:0; opacity:0}
.row{display:flex; gap:8px}
.btn-toggle{flex:1; text-align:center; padding:9px 0; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--sub); font-size:13px; cursor:pointer}
.btn-toggle.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.pao-btn{flex:1; text-align:center; padding:9px 0; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:13px; cursor:pointer}
.pao-btn.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--sub); cursor:pointer; margin-right:6px}
.chk.on{background:var(--accent-bg); color:var(--accent-text); border-color:transparent}
.actions{display:flex; gap:8px; margin-top:22px}
.btn-main{flex:1; padding:13px; border-radius:11px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer}
.btn-sub{padding:13px 16px; border-radius:11px; border:1px solid var(--border); background:var(--card); color:var(--sub); font-size:14px; cursor:pointer}
.err{color:var(--danger-text); font-size:12px; margin-top:4px; display:none}
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px">
    <h1 style="margin:0">Beauty 4 MJ</h1>
    <div style="position:relative; flex:0 1 150px">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 검색" oninput="onSearch(event)" style="margin-bottom:0; width:100%; text-align:right; padding-right:26px">
      <button id="searchClearBtn" onclick="clearSearch()" style="display:none; position:absolute; right:4px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--sub); font-size:15px; line-height:1; padding:4px; cursor:pointer">✕</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <button id="inuseToggleBtn" class="chip toggle-btn" style="margin-top:6px" onclick="toggleInuseOnly()">사용중만 보기</button>
</header>

<main>
  <div class="hint" id="hint">
    <div style="flex:1">
      <div>알림은 이 앱을 열어둔 상태에서 확인돼요. iPhone은 공유 버튼 → "홈 화면에 추가" 후 사용하시면 더 잘 열어보게 돼요.</div>
      <button class="backup-btn" style="margin-top:8px; flex:none; padding:6px 12px" onclick="sendTestNotification()">🔔 테스트 알림 보내기</button>
    </div>
    <button onclick="document.getElementById('hint').style.display='none'">✕</button>
  </div>
  <div id="list"></div>

<script>
const STORE_KEY='cosmetics-expiry-items';
let items = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
if(items.length===0){
  items = [
    {id:'seed1', name:'랑끄 워터팡 누드시킨 파데 크림', category:'색조', status:'unopened', method:'date', directDate:'2027-02-16', notifyDays:[30,7], photo:null, usedUp:false},
    {id:'seed2', name:'마티스 글리코아미노글리칸즈', category:'스킨케어', status:'unopened', method:'date', directDate:'2027-03-11', notifyDays:[30,7], photo:null, usedUp:false},
    {id:'seed3', name:'메노킨 30초 퀵 버블 마스크 클리어', category:'클렌징', status:'inuse', method:'date', directDate:'2027-09-26', notifyDays:[30,7], photo:null, usedUp:false},
    {id:'seed4', name:'마녀공장 비피다 바이옴 아쿠아 베리어 크림', category:'스킨케어', status:'unopened', method:'date', directDate:'2027-10-15', notifyDays:[30,7], photo:null, usedUp:false},
    {id:'seed5', name:'썸블라썸 스피큘러 아이백 크림', category:'스킨케어', status:'unopened', method:'date', directDate:'2027-11-23', notifyDays:[30,7], photo:null, usedUp:false},
    {id:'seed6', name:'라센느 로에 큐어 인텐시브 이엑스 크림', category:'스킨케어', status:'unopened', method:'date', directDate:'2027-12-02', notifyDays:[30,7], photo:null, usedUp:false},
    {id:'seed7', name:'성분에디터 그린토마토 포어 리프팅 앰플토너', category:'스킨케어', status:'unopened', method:'date', directDate:'2027-12-11', notifyDays:[30,7], photo:null, usedUp:false},
    {id:'seed8', name:'시드물 웰빙 녹차 판테놀 스킨', category:'스킨케어', status:'unopened', method:'date', directDate:'2027-12-21', notifyDays:[30,7], photo:null, usedUp:false}
  ];
  localStorage.setItem(STORE_KEY, JSON.stringify(items));
}
let currentFilter = '전체';
let searchQuery = '';
let inuseOnly = false;
let editingId = null;
let photoData = null;
let curMethod = 'pao';
let curStatus = 'unopened';
let curPao = 12;
let curNotify = [30,7];
let curUsedUp = false;

function save_store(){ localStorage.setItem(STORE_KEY, JSON.stringify(items)); }

function getExpiry(it){
  if(it.method==='date') return new Date(it.directDate);
  const d = new Date(it.openDate);
  d.setMonth(d.getMonth()+it.paoMonths);
  return d;
}
function ddayOf(it){
  const exp = getExpiry(it);
  const today = new Date(); today.setHours(0,0,0,0);
  exp.setHours(0,0,0,0);
  return Math.round((exp-today)/86400000);
}
function formatDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}.${m}.${day}`;
}

const CATEGORY_ORDER = ['스킨케어','클렌징','선크림','색조','기타'];
function renderChips(){
  const present = [...new Set(items.map(i=>i.category))];
  const extra = present.filter(c=>!CATEGORY_ORDER.includes(c));
  const cats = ['전체', ...CATEGORY_ORDER, ...extra];
  const box = document.getElementById('chips');
  box.innerHTML = cats.map(c=>
    `<div class="chip ${c===currentFilter?'active':''}" onclick="setFilter('${c}')">${c}</div>`
  ).join('');
}
function setFilter(c){ currentFilter = c; render(); }
function onSearch(e){
  searchQuery = e.target.value;
  document.getElementById('searchClearBtn').style.display = searchQuery ? 'block' : 'none';
  render();
}
function clearSearch(){
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClearBtn').style.display = 'none';
  render();
}
function toggleInuseOnly(){ inuseOnly = !inuseOnly; render(); }

function render(){
  renderChips();
  document.getElementById('inuseToggleBtn').classList.toggle('active', inuseOnly);
  const list = document.getElementById('list');
  let active = items.filter(i=>!i.usedUp);
  let done = items.filter(i=>i.usedUp);
  if(currentFilter!=='전체'){
    active = active.filter(i=>i.category===currentFilter);
    done = done.filter(i=>i.category===currentFilter);
  }
  if(inuseOnly){
    active = active.filter(i=>i.status==='inuse');
  }
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    active = active.filter(i=>i.name.toLowerCase().includes(q));
    done = done.filter(i=>i.name.toLowerCase().includes(q));
  }
  active.sort((a,b)=>ddayOf(a)-ddayOf(b));
  const upcoming = active.filter(i=>ddayOf(i)>=0);
  const expired = active.filter(i=>ddayOf(i)<0).sort((a,b)=>ddayOf(b)-ddayOf(a));

  if(items.length===0){
    list.innerHTML = '<div class="empty">아직 등록된 제품이 없어요.<br>오른쪽 아래 + 버튼으로 추가해보세요.</div>';
    return;
  }
  let html = upcoming.map(it=>cardHtml(it)).join('');
  if(expired.length){
    html += `<div class="section-title">만료됨</div>` + expired.map(it=>cardHtml(it)).join('');
  }
  if(done.length){
    html += `<div class="section-title">사용완료</div>` + done.map(it=>cardHtml(it,true)).join('');
  }
  list.innerHTML = html || `<div class="empty">${searchQuery.trim() ? '검색 결과가 없어요.' : '해당 조건에 맞는 제품이 없어요.'}</div>`;
}

function cardHtml(it, isDone){
  const dday = ddayOf(it);
  const exp = getExpiry(it);
  let cls='neutral';
  if(!isDone && dday<=30) cls='danger';
  const thumb = it.photo ? `<img class="thumb" src="${it.photo}">` : `<div class="thumb"></div>`;

  let bar = '';
  if(!isDone){
    const barColor = dday<=30 ? 'var(--danger-text)' : 'var(--accent)';
    const rawPct = Math.max(0, Math.min(60, dday)) / 60 * 100;
    const pct = Math.max(8, Math.min(92, rawPct));
    const badgeLabel = dday<0 ? `D+${-dday}` : `D-${dday}`;
    bar = `<div style="margin-top:12px; position:relative; height:20px">
      <div style="position:absolute; top:50%; left:0; right:0; height:4px; background:var(--border); border-radius:999px; transform:translateY(-50%)"></div>
      <div style="position:absolute; top:50%; left:0; width:${pct}%; height:4px; background:${barColor}; border-radius:999px; transform:translateY(-50%)"></div>
      <div style="position:absolute; top:50%; left:${pct}%; transform:translate(-50%,-50%); background:${barColor}; color:#fff; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.15)">${badgeLabel}</div>
    </div>`;
  }

  return `<div class="card ${cls} ${isDone?'done':''}" onclick="openModal('${it.id}')" style="flex-direction:column; align-items:stretch">
    <div style="display:flex; align-items:center; gap:12px">
      ${thumb}
      <div style="flex:1">
        <p class="item-name">${escapeHtml(it.name)}</p>
        <p class="item-sub">${it.category} · ${it.status==='unopened'?'미개봉':'<span style="color:var(--accent2-text); font-weight:600">사용중</span>'}</p>
      </div>
      <div style="font-size:11px; color:var(--sub); white-space:nowrap; flex:0 0 auto">${isDone ? '사용완료' : formatDate(exp)+'까지'}</div>
    </div>
    ${bar}
  </div>`;
}
function escapeHtml(s){ return s.replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function openModal(id){
  editingId = id || null;
  photoData = null;
  document.getElementById('photoInput').value='';
  document.getElementById('photoPreview').style.display='none';
  document.getElementById('uploadLabel').style.display='inline';
  document.getElementById('errName').style.display='none';
  document.getElementById('errDate').style.display='none';
  document.getElementById('deleteBtn').style.display = id ? 'block':'none';
  document.getElementById('usedUpWrap').style.display = id ? 'block':'none';

  if(id){
    const it = items.find(i=>i.id===id);
    document.getElementById('modalTitle').textContent='제품 수정';
    document.getElementById('fName').value = it.name;
    document.getElementById('fCategory').value = it.category;
    setStatus(it.status);
    setMethod(it.method);
    if(it.method==='pao'){
      document.getElementById('fOpenDate').value = it.openDate;
      setPao(it.paoMonths);
    } else {
      document.getElementById('fDirectDate').value = it.directDate;
    }
    curNotify = [...it.notifyDays];
    document.querySelectorAll('.chk').forEach(el=>{
      const d = parseInt(el.dataset.d);
      el.classList.toggle('on', curNotify.includes(d));
    });
    if(it.photo){ photoData = it.photo; document.getElementById('photoPreview').src=it.photo; document.getElementById('photoPreview').style.display='block'; document.getElementById('uploadLabel').style.display='none'; }
    document.getElementById('fMemo').value = it.memo || '';
    curUsedUp = !!it.usedUp;
    applyUsedUpStyle();
  } else {
    document.getElementById('modalTitle').textContent='제품 등록';
    document.getElementById('fName').value='';
    document.getElementById('fCategory').value='스킨케어';
    setStatus('unopened');
    setMethod('pao');
    setPao(12);
    document.getElementById('fOpenDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('fDirectDate').value='';
    document.getElementById('fMemo').value='';
    curUsedUp = false;
    applyUsedUpStyle();
    curNotify = [30,7];
    document.querySelectorAll('.chk').forEach(el=>{
      el.classList.toggle('on', curNotify.includes(parseInt(el.dataset.d)));
    });
  }
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

function setStatus(s){
  curStatus = s;
  document.getElementById('statusUnopened').classList.toggle('on', s==='unopened');
  document.getElementById('statusInuse').classList.toggle('on', s==='inuse');
}
function setMethod(m){
  curMethod = m;
  document.getElementById('methodPao').classList.toggle('on', m==='pao');
  document.getElementById('methodDate').classList.toggle('on', m==='date');
  document.getElementById('paoFields').style.display = m==='pao' ? 'block':'none';
  document.getElementById('dateFields').style.display = m==='date' ? 'block':'none';
}
function setPao(m){
  curPao = m;
  document.querySelectorAll('.pao-btn').forEach(el=>el.classList.toggle('on', parseInt(el.dataset.m)===m));
}
function toggleNotify(d){
  const idx = curNotify.indexOf(d);
  if(idx>-1) curNotify.splice(idx,1); else curNotify.push(d);
  document.querySelectorAll('.chk').forEach(el=>{
    if(parseInt(el.dataset.d)===d) el.classList.toggle('on', curNotify.includes(d));
  });
}
function toggleUsedUpField(){
  curUsedUp = !curUsedUp;
  applyUsedUpStyle();
}
function applyUsedUpStyle(){
  const el = document.getElementById('usedUpToggle');
  if(curUsedUp){
    el.style.background = 'var(--accent2-bg)';
    el.style.color = 'var(--accent2-text)';
    el.style.borderColor = 'transparent';
    el.textContent = '✅ 사용완료 처리됨';
  } else {
    el.style.background = '';
    el.style.color = '';
    el.style.borderColor = '';
    el.textContent = '사용완료로 표시';
  }
}
function onPhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxW = 300;
      const scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      photoData = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('photoPreview').src = photoData;
      document.getElementById('photoPreview').style.display='block';
      document.getElementById('uploadLabel').style.display='none';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function save(){
  const name = document.getElementById('fName').value.trim();
  document.getElementById('errName').style.display = name ? 'none':'block';
  let dateOk = true;
  let openDate, directDate;
  if(curMethod==='pao'){
    openDate = document.getElementById('fOpenDate').value;
    dateOk = !!openDate;
  } else {
    directDate = document.getElementById('fDirectDate').value;
    dateOk = !!directDate;
  }
  document.getElementById('errDate').style.display = dateOk ? 'none':'block';
  if(!name || !dateOk) return;

  const data = {
    id: editingId || ('id'+Date.now()),
    name, category: document.getElementById('fCategory').value,
    status: curStatus, method: curMethod,
    openDate, paoMonths: curPao, directDate,
    notifyDays: [...curNotify], photo: photoData,
    memo: document.getElementById('fMemo').value.trim(),
    usedUp: curUsedUp
  };
  if(editingId){
    items = items.map(i=>i.id===editingId ? data : i);
  } else {
    items.push(data);
  }
  save_store();
  closeModal();
  render();
}
function removeItem(){
  if(!editingId) return;
  if(confirm('이 제품을 삭제할까요?')){
    items = items.filter(i=>i.id!==editingId);
    save_store();
    closeModal();
    render();
  }
}

function csvEscape(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(/[",\n\r]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function parseCSV(text){
  const rows = []; let field='', row=[], inQuotes=false, i=0;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=c; i++; continue;
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ row.push(field); field=''; i++; continue; }
      if(c==='\n' || c==='\r'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(field); rows.push(row); row=[]; field=''; i++; continue;
      }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v=>v && v.trim()!==''));
}
function exportData(){
  const header = ['화장품명','카테고리','유통기한','상태','메모'];
  const rows = items.map(it=>{
    const exp = getExpiry(it);
    const y=exp.getFullYear(), m=String(exp.getMonth()+1).padStart(2,'0'), d=String(exp.getDate()).padStart(2,'0');
    const statusLabel = it.usedUp ? '사용완료' : (it.status==='unopened' ? '미개봉' : '개봉');
    return [it.name, it.category, `${y}-${m}-${d}`, statusLabel, it.memo || ''];
  });
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `Beauty4MJ_${today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const rows = parseCSV(ev.target.result);
      if(rows.length<2) throw new Error('empty');
      const header = rows[0].map(h=>h.trim());
      const findCol = names => header.findIndex(h=>names.includes(h));
      const nameIdx = findCol(['화장품명','제품명']);
      const catIdx = findCol(['카테고리']);
      const expIdx = findCol(['유통기한','사용기한']);
      const statusIdx = findCol(['상태','개봉여부']);
      const memoIdx = findCol(['메모']);
      if(nameIdx===-1 || expIdx===-1) throw new Error('format');
      const parsed = rows.slice(1).filter(r=>r[nameIdx] && r[nameIdx].trim()).map(r=>{
        const dateStr = r[expIdx] || '';
        const m = dateStr.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
        const directDate = m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : '';
        const statusRaw = statusIdx>-1 ? (r[statusIdx]||'') : '';
        return {
          id: 'id'+Date.now()+Math.random().toString(36).slice(2,7),
          name: r[nameIdx].trim(),
          category: (catIdx>-1 && r[catIdx] && r[catIdx].trim()) || '기타',
          status: statusRaw.includes('미개봉') ? 'unopened' : 'inuse',
          method: 'date', openDate:'', paoMonths:12, directDate,
          notifyDays:[30,7], photo:null,
          memo: memoIdx>-1 ? (r[memoIdx]||'').trim() : '',
          usedUp: statusRaw.includes('완료')
        };
      }).filter(it=>it.directDate);
      if(!parsed.length) throw new Error('no rows');
      items = items.concat(parsed);
      save_store();
      render();
      alert(`${parsed.length}개 항목을 불러왔어요.`);
    }catch(err){
      alert('CSV 형식을 확인해주세요. (화장품명, 유통기한 열이 필요해요)');
    }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function sendTestNotification(){
  if(!('Notification' in window)){ alert('이 브라우저는 알림을 지원하지 않아요.'); return; }
  const fire = () => new Notification('🧴 Beauty4MJ 알림 테스트', { body: '이런 모양으로 떠요! 실제로는 유통기한 임박 시 자동으로 알려드려요.' });
  if(Notification.permission === 'granted'){
    fire();
  } else if(Notification.permission === 'denied'){
    alert('알림이 차단되어 있어요. iPhone은 설정 > Safari(또는 이 앱) > 알림에서 허용해주세요.');
  } else {
    Notification.requestPermission().then(p=>{ if(p==='granted') fire(); });
  }
}

// 알림 체크 (앱이 열려 있을 때만 동작)
function checkNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const today = new Date().toISOString().slice(0,10);
  const lastCheck = localStorage.getItem('notify-check-'+today);
  if(lastCheck) return;
  items.filter(i=>!i.usedUp).forEach(it=>{
    const d = ddayOf(it);
    if(it.notifyDays.includes(d)){
      new Notification('유통기한 임박', { body: `${it.name} · D-${d}` });
    }
  });
  localStorage.setItem('notify-check-'+today, '1');
}
if('Notification' in window && Notification.permission==='default'){
  setTimeout(()=>{ Notification.requestPermission().then(()=>checkNotifications()); }, 800);
} else {
  checkNotifications();
}

render();
